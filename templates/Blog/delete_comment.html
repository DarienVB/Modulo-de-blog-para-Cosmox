{% extends 'Blog/base.html' %}

{% block content %}

<div class="card">

    <div class="card-body text-dark">

        <h3>

            ¿Eliminar comentario?

        </h3>

        <div class="mb-3">

            {{ comment.content|safe }}

        </div>

        <form method="POST">

            {% csrf_token %}

            <button
                class="btn btn-danger">

                Eliminar

            </button>


            <a
                href="{% url 'blog' comment.blog.blog_id %}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
