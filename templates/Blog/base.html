<!DOCTYPE html>
<html>

<head>
<style>

         .auto-close-message{

           transition: 0.5s;

        }

    </style>
    <title>Cosmox Blog</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        .ck-editor__editable {

            min-height: 300px !important;

            background: white !important;

            color: black !important;

        }


        .ck-content {

            color: black !important;

        }


        .ck.ck-editor {

            color: black !important;

        }

        .blog-card {

    transition: 0.3s;

}

.blog-card:hover {

    transform: scale(1.03);

}

    </style>
    
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black">

    <div class="container">

    <a
        class="navbar-brand"
        href="{% url 'home' %}">

        COSMOX BLOG

    </a>


    {% if request.user.is_authenticated %}

        <div>

            <span class="me-3">

                {{ request.user }}

            </span>

            <form
              method="POST"
              action="{% url 'logout' %}"
              class="d-inline">

              {% csrf_token %}

              <button
              type="submit"
              class="btn btn-outline-light">

              Cerrar sesión

              </button>

            </form>
        </div>

    {% else %}

        <a
            href="{% url 'login' %}"
            class="btn btn-outline-light">

            Iniciar sesión

        </a>

    {% endif %}

</div>
</nav>

{% if messages %}

<div
    class="position-fixed top-0 end-0 p-3"
    style="z-index:9999;">

    {% for message in messages %}

        <div
            class="alert alert-{{ message.tags }} shadow auto-close-message">

            {{ message }}

        </div>

    {% endfor %}

</div>

{% endif %}

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>
<script>

    setTimeout(function(){

        document
            .querySelectorAll(
                '.auto-close-message'
            )
            .forEach(function(msg){

                msg.remove();

            });

    }, 5000);

</script>
</body>
</html>
