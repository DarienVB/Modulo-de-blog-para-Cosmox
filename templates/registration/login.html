{% extends 'Blog/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card">

            <div class="card-body text-dark">

                <h2 class="mb-4">

                    Iniciar sesión

                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        class="btn btn-dark">

                        Entrar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
